name: Jira status

on:
  pull_request:
    types:
      - closed
    branches:
      - develop
      - master

permissions:
  contents: read
  pull-requests: read

jobs:
  move-ticket:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read pull request commit subjects
        id: commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          subjects="$(gh api --jq '.[] | .commit.message | split("\n")[0]' "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits")"
          {
            echo "subjects<<EOF"
            printf '%s\n' "$subjects"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Move the Jira ticket
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMIT_SUBJECTS: ${{ steps.commits.outputs.subjects }}
        run: java ci/JiraTransition.java
